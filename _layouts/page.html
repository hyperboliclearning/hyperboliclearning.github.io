---
layout: default
---

<!-- Header styles are now unified in /style.css -->

<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    {% if page.display_date %}
    <p class="post-date">Update: <time datetime="{{ page.display_date | escape }}">{{ page.display_date | escape }}</time></p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
